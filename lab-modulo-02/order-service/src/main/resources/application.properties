spring.application.name=order-service
server.port=${SERVER_PORT:8082}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:techstore}
spring.datasource.username=${DB_USER:techstore}
spring.datasource.password=${DB_PASSWORD:techstore_dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8081}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
