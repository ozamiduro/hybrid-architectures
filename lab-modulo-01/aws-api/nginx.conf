server {
    listen 80;
    server_name orion-api;

    location /api/v1/health {
        default_type application/json;
        return 200 '{"status":"UP","service":"ORION-Core","environment":"AWS","region":"us-east-1","latency_ms":12}';
    }

    location /api/v1/core {
        default_type application/json;
        return 200 '{"service":"ORION-Core","core_location":"ON-PREMISE","database":"10.10.0.50","status":"connected"}';
    }

    location /api/v1/info {
        default_type application/json;
        return 200 '{"architecture":"hybrid","onprem_cidr":"10.10.0.0/16","aws_cidr":"10.20.0.0/16"}';
    }
}
