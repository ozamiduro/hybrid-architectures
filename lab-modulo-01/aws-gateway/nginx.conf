server {
    listen 80;
    server_name orion-gateway;

    location /api/v1/health {
        proxy_pass http://orion-api/api/v1/health;
    }

    location /api/v1/core {
        proxy_pass http://orion-api/api/v1/core;
    }

    location /api/v1/info {
        proxy_pass http://orion-api/api/v1/info;
    }

    location /frontend {
        proxy_pass http://orion-onprem-front/index.html;
    }
}
