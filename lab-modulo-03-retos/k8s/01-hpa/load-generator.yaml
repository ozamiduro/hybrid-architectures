apiVersion: v1
kind: Pod
metadata:
  name: hpa-load-generator
  namespace: techstore
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            wget -q -O- http://product-service:8081/api/products >/dev/null;
          done
