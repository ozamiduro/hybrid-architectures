apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-stable
  namespace: techstore
spec:
  replicas: 3
  selector: {matchLabels: {app: product-canary-demo, track: stable}}
  template:
    metadata: {labels: {app: product-canary-demo, track: stable}}
    spec:
      containers:
        - name: product
          image: PRODUCT_IMAGE_STABLE
          ports: [{containerPort: 8081}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 250m, memory: 256Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-canary
  namespace: techstore
spec:
  replicas: 1
  selector: {matchLabels: {app: product-canary-demo, track: canary}}
  template:
    metadata: {labels: {app: product-canary-demo, track: canary}}
    spec:
      containers:
        - name: product
          image: PRODUCT_IMAGE_CANARY
          ports: [{containerPort: 8081}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 250m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: product-canary-demo
  namespace: techstore
spec:
  selector: {app: product-canary-demo}
  ports:
    - port: 8081
      targetPort: 8081
