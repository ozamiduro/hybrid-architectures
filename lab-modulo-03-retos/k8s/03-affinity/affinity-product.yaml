apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service-affinity
  namespace: techstore
spec:
  replicas: 3
  selector:
    matchLabels:
      app: product-service-affinity
  template:
    metadata:
      labels:
        app: product-service-affinity
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values: [application]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: product-service-affinity
      containers:
        - name: product-service
          image: PRODUCT_IMAGE
          ports:
            - containerPort: 8081
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
