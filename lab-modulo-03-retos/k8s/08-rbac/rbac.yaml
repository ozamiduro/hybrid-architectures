apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-reader
  namespace: techstore
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: product-reader
  namespace: techstore
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: product-reader
  namespace: techstore
subjects:
  - kind: ServiceAccount
    name: product-reader
    namespace: techstore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: product-reader
